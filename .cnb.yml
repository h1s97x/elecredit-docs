# =============================================================================
# Elecredit 文档站（CNB 内容源）的流水线配置
#
# 内容源与发布源分离是本方案的核心：
#
#   CNB 文档仓（本文件所在仓，内容源，唯一编辑入口）
#        │  main push 即单向同步
#        ▼
#   GitHub 文档仓（发布源）
#        │  .github/workflows/docs.yml：端点覆盖校验 → 构建 → 发布 Pages
#        ▼
#   GitHub Pages
#
# 为什么不在 CNB 侧构建发布：
#   站点发布在 GitHub Pages，让 GitHub Actions 基于「被发布的那份内容」构建，
#   避免 CNB 构建产物与 GitHub 上的内容版本漂移。
#   因此本仓 CI 只负责把内容同步过去，发布与校验都在 GitHub 侧做。
#
# 凭据：GITHUB_USERNAME / GITHUB_TOKEN 来自密钥仓库 h1s97x/secret-env
#   （与 elecredit-api 源码仓共用同一份密钥仓库，不新增 secret）。
# =============================================================================

.git-sync-settings: &git-sync-settings
  # 发布源仓库（GitHub 上的文档仓）
  target_url: https://github.com/h1s97x/elecredit-docs.git
  auth_type: https
  username: ${GITHUB_USERNAME}
  password: ${GITHUB_TOKEN}
  branch: main

# -----------------------------------------------------------------------------
# 一次性引导锚点：确保 GitHub 发布仓已启用 Pages，并（重新）触发站点 workflow。
#
# 为什么需要它（2026-10-12 实测）：
#   .github/workflows/docs.yml 里 actions/configure-pages 带了 enablement: true，
#   但「创建 Pages 站点」这个 API 需要仓库 **admin** 权限，而 workflow 内置的
#   GITHUB_TOKEN 拿不到 administration 作用域（该作用域不在 Actions 可授权列表内）。
#   结果：**全新仓库**首次必然失败在 configure-pages（站点始终 404）。
#   实证：elecredit-docs 的 has_pages=false 时该步骤失败；onefolio-docs
#   的 has_pages=true（曾手工开过）时同款配置正常。
#
# 为什么用 repo 级 token 而不是 GitHub secret：
#   本仓 GITHUB_TOKEN（secret-env 的 classic PAT）本身具备仓库 admin 权限，
#   直接放 CNB 侧用，避免把同一份凭据再复制一份到 GitHub secret
#   ——复制既重复，又扩大暴露面（与源码仓既有治理约定一致）。
#
# 幂等：已启用则跳过创建，只会重新触发一次站点 workflow。平时不跑，仅手动触发。
# -----------------------------------------------------------------------------
.bootstrap-github-pages: &bootstrap-github-pages
  name: bootstrap-github-pages (manual)
  imports:
    - https://cnb.cool/h1s97x/secret-env/-/blob/main/env.yml
  env:
    GH_REPO: h1s97x/elecredit-docs
  stages:
    - name: ensure pages enabled + dispatch docs workflow
      image: node:24
      # ⚠️ 平台会把 script 的换行折叠，故本脚本写成**单行分号**形式（同源码仓约定）。
      script: |
        node --input-type=module -e "const repo=process.env.GH_REPO;const auth='Basic '+Buffer.from(process.env.GITHUB_USERNAME+':'+process.env.GITHUB_TOKEN).toString('base64');const h={Authorization:auth,'User-Agent':'cnb-docs-pipeline','X-GitHub-Api-Version':'2022-11-28'};const api='https://api.github.com/repos/'+repo;const jh=Object.assign({'Content-Type':'application/json'},h);const g=await fetch(api+'/pages',{headers:h});console.log('GET  /pages ->',g.status);if(g.status!==404&&!g.ok){console.log('无法判断 Pages 状态，请检查 GITHUB_TOKEN 权限');process.exit(1)}if(g.ok){console.log('Pages 已启用，跳过创建')}else{const c=await fetch(api+'/pages',{method:'POST',headers:jh,body:JSON.stringify({build_type:'workflow'})});console.log('POST /pages ->',c.status);if(!c.ok){console.log(await c.text());process.exit(1)}console.log('已启用 GitHub Pages（build_type=workflow）')}const d=await fetch(api+'/actions/workflows/docs.yml/dispatches',{method:'POST',headers:jh,body:JSON.stringify({ref:'main'})});console.log('POST dispatch docs.yml ->',d.status);if(!d.ok){console.log('未能触发站点 workflow，请手动重跑或再推一个提交')}"

main:
  push:
    - imports:
        - https://cnb.cool/h1s97x/secret-env/-/blob/main/env.yml
      name: sync to github
      stages:
        - name: sync to github
          image: tencentcom/git-sync
          settings:
            <<: *git-sync-settings
            sync_mode: push

# -----------------------------------------------------------------------------
# $ 兜底分支：仓库级事件（平台约束，同源码仓）。
# 引导 job 同时挂 api_trigger 与 web_trigger，两条触发路径都能用：
#   - api_trigger_ensure_github_pages：供 CLI/API 触发（不用进 UI）
#     注意：api_trigger 的事件键用**下划线**（实测 dot 形式报 CONFIG_EVENT_EMPTY），
#     与 web_trigger 的 dot 形式不同。
#   - web_trigger.ensure_github_pages：供 CNB UI 按钮触发
# -----------------------------------------------------------------------------
$:
  api_trigger_ensure_github_pages:
    - <<: *bootstrap-github-pages
  web_trigger.ensure_github_pages:
    - <<: *bootstrap-github-pages
